name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Unit tests
        run: pytest -q

  cpp-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build C++ engine (OpenCV + ONNX Runtime)
        run: bash cpp/build.sh
      - name: Check binary
        run: test -x cpp/build/cabinsense_engine && ldd cpp/build/cabinsense_engine | grep -E "onnxruntime|opencv"
