[project]
name = "cabinsense"
version = "0.1.0"
description = "Real-time driver monitoring: drowsiness, distraction and phone-use detection with edge inference"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Piyush Desai" }]

[tool.setuptools]
packages = ["cabinsense"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
